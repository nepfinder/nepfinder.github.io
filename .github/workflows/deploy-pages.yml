name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
        env:
          # Optional external form endpoint (Formspree / Web3Forms / Getform URL). Leave unset to use the mailto fallback.
          VITE_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          # Web3Forms access key (public). Setting only this sends the form to api.web3forms.com.
          VITE_CONTACT_ACCESS_KEY: ${{ vars.CONTACT_ACCESS_KEY }}
          # Analytics IDs are public identifiers (not secrets). Leave unset to keep tracking off.
          # GTM-PWL7LJKK = 'nepfinder.com.np' web container (loads GA4 G-Z8JNWXXVH6). A GTM_ID repo variable overrides it.
          VITE_GTM_ID: ${{ vars.GTM_ID || 'GTM-PWL7LJKK' }}
          VITE_GA_ID: ${{ vars.GA_ID }}
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/services/erpnext-implementation/index.html
          test -f dist/ncafe/privacy/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell IndexNow engines (Bing, Yandex, Seznam, Naver...) that every URL in the sitemap
    # may have changed, so they recrawl soon after each deploy. Never fails the deploy.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=064589c8fe2bf62647ad6b743eba2967
          URLS=$(curl -fsS https://nepfinder.com.np/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | grep '^https://nepfinder.com.np' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$URLS" | jq length) URLs"
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"nepfinder.com.np\",\"key\":\"$KEY\",\"keyLocation\":\"https://nepfinder.com.np/$KEY.txt\",\"urlList\":$URLS}"
